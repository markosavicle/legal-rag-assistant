# Self-hosted n8n with Postgres.
#
#   cp .env.example .env    # then fill in the secrets (see the README)
#   docker compose up -d
#
# n8n: http://<host>:5678. The RAG API is reached as http://host.docker.internal:8000 when it
# runs on the same machine (the extra_hosts line makes that name work on Linux too).
services:
  n8n-db:
    image: postgres:17-alpine
    container_name: n8n-db
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Encrypts stored credentials. Back it up: without it, saved credentials cannot be read.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Only for plain-HTTP access on a LAN; set to true once n8n is behind HTTPS.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TZ:-Europe/Belgrade}
      TZ: ${TZ:-Europe/Belgrade}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      # Community nodes (installed from the UI, or manually into ~/.n8n/nodes) live here too.
      - n8n-data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      n8n-db:
        condition: service_healthy

volumes:
  n8n-data:
  n8n-db-data:
