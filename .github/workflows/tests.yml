name: Tests

on:
  pull_request:
    paths-ignore: ['n8n-nodes-legal-rag/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['n8n-nodes-legal-rag/**', '**.md']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Creates the schema so the SQL data checks in tests/test_validate_data.py run instead of skipping.
      - run: python -c "from app.db import init_db; init_db()"
      - run: python -m pytest -q
