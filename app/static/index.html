<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal RAG Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #646b78; --border: #e1e4ea;
    --accent: #2f5bea; --accent-soft: #e8eefe; --danger: #c93636; --danger-soft: #fdecec;
    --ok: #1f8a4c; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa1ad; --border: #2b2f37;
      --accent: #7b9bff; --accent-soft: #232c45; --danger: #ff7a7a; --danger-soft: #3a2224;
      --ok: #5fd08f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }

  .drop { border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 18px 12px; text-align: center; cursor: pointer; color: var(--muted); transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .drop strong { color: var(--accent); }
  .drop small { display: block; margin-top: 4px; font-size: 12px; }
  .uploads { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .uploads li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .uploads .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-busy { color: var(--muted); } .st-ok { color: var(--ok); } .st-err { color: var(--danger); }

  .docs { list-style: none; margin: 14px 0 0; padding: 0; }
  .docs li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--border); }
  .docs .meta { flex: 1; min-width: 0; cursor: pointer; }
  .docs input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  .docs li.off .fname { color: var(--muted); text-decoration: line-through; }
  .icon-btn.only:hover { color: var(--accent); background: var(--accent-soft); }
  .scope { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  .scope strong { color: var(--text); font-weight: 600; }
  .docs .fname { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs .sub { font-size: 12px; color: var(--muted); }
  .icon-btn { border: 1px solid transparent; background: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { color: var(--danger); background: var(--danger-soft); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  .chat { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ask textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  .ask textarea:focus, .ask select:focus, .ask input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  label.k { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  label.k input { width: 56px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: var(--bg); }
  .primary { margin-left: auto; border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 8px 18px; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .examples button { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .examples button:hover { color: var(--accent); border-color: var(--accent); }

  .turn .q { font-weight: 600; margin-bottom: 8px; }
  .turn .a { white-space: normal; }
  .turn .a p { margin: 0 0 8px; }
  .cite { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 5px; font-size: 12px; font-weight: 700; cursor: pointer; vertical-align: 1px; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .sources { display: grid; gap: 8px; margin-top: 8px; }
  .src { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; transition: border-color .2s, background .2s; }
  .src.flash { border-color: var(--accent); background: var(--accent-soft); }
  .src .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; margin-bottom: 4px; }
  .src .score { font-weight: 400; color: var(--muted); white-space: nowrap; }
  .src .excerpt { color: var(--muted); white-space: pre-wrap; }
  .error { color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 10px 12px; }
  .thinking { color: var(--muted); }
  .thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<header>
  <h1>Legal RAG Assistant</h1>
  <span class="pill" id="provider">Connecting…</span>
</header>

<main class="layout">
  <section class="card" aria-label="Documents">
    <h2>Documents</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload documents">
      <strong>Choose files</strong> or drop them here
      <small id="supported">PDF, DOCX, TXT, MD</small>
    </div>
    <input type="file" id="file" multiple hidden>
    <ul class="uploads" id="uploads"></ul>
    <p class="scope" id="scope" hidden></p>
    <ul class="docs" id="docs"></ul>
  </section>

  <section class="chat">
    <div class="card ask">
      <h2>Ask a question</h2>
      <textarea id="question" placeholder="e.g. Koliko najmanje traje godišnji odmor?"></textarea>
      <div class="controls">
        <div class="seg" role="group" aria-label="Search mode" id="modes">
          <button type="button" data-mode="vector" aria-pressed="true">Semantic</button>
          <button type="button" data-mode="hybrid" aria-pressed="false">Hybrid</button>
          <button type="button" data-mode="keyword" aria-pressed="false">Keyword</button>
        </div>
        <label class="k">Sources <input type="number" id="k" min="1" max="20" value="5"></label>
        <button class="primary" id="ask">Ask</button>
      </div>
      <div class="hint">Enter to ask · Shift+Enter for a new line · Compare search modes on the same question to see how retrieval changes.</div>
      <div class="examples" id="examples">
        <button type="button">Koliko najmanje traje godišnji odmor?</button>
        <button type="button">Koliko najduže može da traje probni rad?</button>
        <button type="button">Koliko časova nedeljno iznosi puno radno vreme?</button>
      </div>
    </div>
    <div id="turns" class="chat"></div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
let mode = "vector";

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, options = {}) {
  const response = await fetch(path, options);
  if (response.status === 204) return null;
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join("; ") : body.detail;
    throw new Error(detail || `Request failed (${response.status})`);
  }
  return body;
}

// ---- info ---------------------------------------------------------------
api("/info").then((info) => {
  $("#provider").textContent = `${info.provider} · ${info.chat_model}`;
  $("#provider").title = `Embeddings: ${info.embedding_model}`;
  $("#k").value = info.top_k;
  $("#supported").textContent = info.supported_files.map((s) => s.slice(1).toUpperCase()).join(", ");
  $("#file").accept = info.supported_files.join(",");
}).catch(() => { $("#provider").textContent = "API not reachable"; });

// ---- documents ----------------------------------------------------------
// Which documents a question searches. Unticked documents are remembered, so new uploads start ticked.
let documents = [];
const excluded = new Set();
const selectedDocuments = () => documents.filter((d) => !excluded.has(d.id));

function renderScope() {
  const scope = $("#scope");
  scope.hidden = documents.length < 2;
  const selected = selectedDocuments();
  if (selected.length === documents.length) scope.innerHTML = `Questions search <strong>all ${documents.length} documents</strong>. Untick a document or use <em>Only</em> to narrow it down.`;
  else if (selected.length === 0) scope.innerHTML = "<strong>No documents selected.</strong> Tick at least one.";
  else scope.innerHTML = `Questions search <strong>${selected.length} of ${documents.length}</strong>: ${selected.map((d) => escapeHtml(d.filename)).join(", ")}`;
  document.querySelectorAll("#docs li[data-id]").forEach((li) => li.classList.toggle("off", excluded.has(Number(li.dataset.id))));
}

async function loadDocuments() {
  documents = await api("/documents");
  const list = $("#docs");
  if (!documents.length) {
    list.innerHTML = '<li class="empty">No documents yet. Upload a law or contract to start.</li>';
    renderScope();
    return;
  }
  list.innerHTML = documents.map((d) => `
    <li data-id="${d.id}">
      <input type="checkbox" data-scope="${d.id}" ${excluded.has(d.id) ? "" : "checked"} aria-label="Search in ${escapeHtml(d.filename)}">
      <div class="meta">
        <span class="fname" title="${escapeHtml(d.filename)}">${escapeHtml(d.filename)}</span>
        <span class="sub">${d.chunks} chunks · ${new Date(d.created_at).toLocaleDateString()}</span>
      </div>
      ${documents.length > 1 ? `<button class="icon-btn only" data-only="${d.id}" title="Search only this document">Only</button>` : ""}
      <button class="icon-btn" data-delete="${d.id}" data-name="${escapeHtml(d.filename)}" aria-label="Delete ${escapeHtml(d.filename)}">Delete</button>
    </li>`).join("");
  renderScope();
}

$("#docs").addEventListener("click", async (event) => {
  const only = event.target.closest("[data-only]");
  if (only) {
    excluded.clear();
    documents.forEach((d) => { if (d.id !== Number(only.dataset.only)) excluded.add(d.id); });
    document.querySelectorAll("#docs [data-scope]").forEach((box) => { box.checked = !excluded.has(Number(box.dataset.scope)); });
    renderScope();
    return;
  }
  const meta = event.target.closest(".meta");
  if (meta) {  // clicking the name toggles the checkbox too
    const box = meta.parentElement.querySelector("[data-scope]");
    box.checked = !box.checked;
    box.dispatchEvent(new Event("change", { bubbles: true }));
    return;
  }
  const button = event.target.closest("[data-delete]");
  if (!button || !confirm(`Delete "${button.dataset.name}" and its chunks?`)) return;
  await api(`/documents/${button.dataset.delete}`, { method: "DELETE" });
  excluded.delete(Number(button.dataset.delete));
  loadDocuments();
});

$("#docs").addEventListener("change", (event) => {
  const box = event.target.closest("[data-scope]");
  if (!box) return;
  const id = Number(box.dataset.scope);
  box.checked ? excluded.delete(id) : excluded.add(id);
  renderScope();
});

async function uploadFiles(files) {
  for (const file of files) {
    const item = document.createElement("li");
    item.innerHTML = `<span class="name">${escapeHtml(file.name)}</span><span class="st-busy" title="Free tiers limit embeddings per minute, so a full law can take a few minutes.">Indexing… (large files take a few minutes)</span>`;
    $("#uploads").prepend(item);
    const status = item.lastElementChild;
    try {
      const form = new FormData();
      form.append("file", file);
      const result = await api("/documents", { method: "POST", body: form });
      status.className = "st-ok";
      status.textContent = `${result.chunks} chunks · ${result.embeddings_cached} cached`;
    } catch (error) {
      status.className = "st-err";
      status.textContent = "Failed";
      status.title = error.message;
      item.insertAdjacentHTML("afterend", `<li class="st-err">${escapeHtml(error.message)}</li>`);
    }
    loadDocuments();
  }
}

const drop = $("#drop");
drop.addEventListener("click", () => $("#file").click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } });
$("#file").addEventListener("change", (e) => { uploadFiles([...e.target.files]); e.target.value = ""; });
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => uploadFiles([...e.dataTransfer.files]));

// ---- asking -------------------------------------------------------------
$("#modes").addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  mode = button.dataset.mode;
  document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", b === button));
});

$("#examples").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  $("#question").value = e.target.textContent;
  ask();
});

$("#question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("#ask").addEventListener("click", ask);

function renderAnswer(text, turnId) {
  // Paragraphs, with [n] (or [1, 3]) citations turned into buttons that highlight the matching source.
  return escapeHtml(text).split(/\n{2,}/).map((para) =>
    "<p>" + para.replace(/\n/g, "<br>").replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g,
      (_, group) => group.split(/\s*,\s*/).map((n) =>
        `<button class="cite" data-turn="${turnId}" data-n="${n}" aria-label="Show source ${n}">${n}</button>`).join("")) + "</p>"
  ).join("");
}

// What the score means depends on the search mode.
const SCORE_LABEL = { vector: "similarity", keyword: "keyword rank", hybrid: "fusion score" };

function renderSources(sources, turnId, mode) {
  return sources.map((s) => `
    <div class="src" id="src-${turnId}-${s.n}">
      <div class="head"><span>[${s.n}] ${escapeHtml(s.source)}</span><span class="score">${SCORE_LABEL[mode]} ${s.score}</span></div>
      <div class="excerpt">${escapeHtml(s.text)}</div>
    </div>`).join("");
}

let turnCounter = 0;
async function ask() {
  const question = $("#question").value.trim();
  if (question.length < 3 || $("#ask").disabled) return;
  const inScope = selectedDocuments();
  if (documents.length && !inScope.length) { renderScope(); $("#scope").scrollIntoView({ block: "nearest" }); return; }
  const filtered = inScope.length < documents.length;
  const scopeLabel = filtered ? ` · in ${inScope.map((d) => escapeHtml(d.filename)).join(", ")}` : "";
  const turnId = ++turnCounter;
  const askedMode = mode;  // the toggle may change while we wait
  const modeLabel = { hybrid: "Hybrid", vector: "Semantic", keyword: "Keyword" }[askedMode];

  const turn = document.createElement("article");
  turn.className = "card turn";
  turn.innerHTML = `<div class="q">${escapeHtml(question)}</div><div class="a thinking">Searching and answering</div>`;
  $("#turns").prepend(turn);
  $("#ask").disabled = true;

  try {
    const result = await api("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question, mode: askedMode, k: Number($("#k").value) || 5,
        documents: filtered ? inScope.map((d) => d.id) : null,
      }),
    });
    const tokens = (result.usage.prompt_tokens || 0) + (result.usage.completion_tokens || 0);
    turn.innerHTML = `
      <div class="q">${escapeHtml(question)}</div>
      <div class="a">${renderAnswer(result.answer, turnId)}</div>
      <div class="stats">${modeLabel} search${scopeLabel} · ${result.sources.length} sources · search ${(result.retrieval_ms / 1000).toFixed(1)} s + answer ${(result.generation_ms / 1000).toFixed(1)} s${tokens ? ` · ${tokens} tokens` : ""}</div>
      ${result.sources.length ? `<details><summary>Show the ${result.sources.length} source passages</summary><div class="sources">${renderSources(result.sources, turnId, askedMode)}</div></details>` : ""}`;
    $("#question").value = "";
  } catch (error) {
    turn.querySelector(".a").outerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
  } finally {
    $("#ask").disabled = false;
  }
}

$("#turns").addEventListener("click", (e) => {
  const cite = e.target.closest(".cite");
  if (!cite) return;
  const source = document.getElementById(`src-${cite.dataset.turn}-${cite.dataset.n}`);
  if (!source) return;
  source.closest("details").open = true;
  source.scrollIntoView({ behavior: "smooth", block: "nearest" });
  source.classList.add("flash");
  setTimeout(() => source.classList.remove("flash"), 1200);
});

loadDocuments().catch((error) => { $("#docs").innerHTML = `<li class="error">${escapeHtml(error.message)}</li>`; });
</script>
</body>
</html>
